[package]
name = "ajbot-gui"
version = "0.1.0"
edition = "2021"
description = "Front end for the All's Justice ML bot: roster picker, run control, match statistics"

[[bin]]
name = "ajbot-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
