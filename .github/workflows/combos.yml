# Checks every change to the combo library (valid JSON, notation that reads
# for that character) and, on main, rebuilds the combos/*.md pages.
name: Combo library

on:
  pull_request:
    paths:
      - "combos/**"
      - "ajbot/notation.py"
      - "ajbot/combodb.py"
  push:
    branches: [main]
    paths:
      - "combos/**"
      - "ajbot/notation.py"
      - "ajbot/combodb.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check
        run: python -m ajbot.combodb check

      - name: Rebuild pages
        if: github.event_name != 'pull_request'
        run: |
          python -m ajbot.combodb fill-ids
          python -m ajbot.combodb render
          if [ -n "$(git status --porcelain combos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add combos
            git commit -m "Rebuild combo pages"
            git push
          fi
