# Builds the GUI and the icon extractor on every push to main that touches
# either and publishes ajbot-gui.exe + ajbot-iconextract.exe as a new release. tools/update.py and the Setup page pick
# up the newest release that has the exe. The game files zip is published
# by hand (tools/make_release.py) and is found in whichever release holds it.
name: GUI release

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "tools/iconextract/**"
      - ".github/workflows/gui-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gui-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Build
        working-directory: gui
        run: cargo build --release --locked

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build icon extractor
        working-directory: tools/iconextract
        shell: bash
        run: |
          dotnet publish -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o out
          cp out/iconextract.exe ../../ajbot-iconextract.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          notes="Automatic GUI build of ${GITHUB_SHA::7}: $(git log -1 --format=%s)

          Download ajbot-gui.exe into your AJBot folder, or use Setup > Update now.
          The game files zip is in the newest release that has one."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" gui/target/release/ajbot-gui.exe ajbot-iconextract.exe --clobber
          else
            gh release create "$tag" gui/target/release/ajbot-gui.exe ajbot-iconextract.exe \
              --title "GUI $tag" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi

      - name: Keep the newest 5 GUI-only releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases that carry a game files zip or a model are never removed
          # here (training/release_model.py prunes its own).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select([.assets[].name | startswith("ajbot-gamefiles") or startswith("ajbot-model")] | any | not) | select(.tag_name | startswith("model-") | not) | .tag_name' \
            | tail -n +6 | while read -r t; do
                gh release delete "$t" --yes --cleanup-tag
              done
